services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.comet
    network_mode: host
    environment:
      CPC_CHAIN_ID: ${CPC_CHAIN_ID:?Run web_services.py}
      CPC_RPC_URL: ${CPC_RPC_URL:?Run web_services.py}
      CPC_INDEX_PATH: /data/index.sqlite
      CPC_EXPECTED_NODE_ID: ${CPC_EXPECTED_NODE_ID:-}
      CPC_GENESIS_SHA256: ${CPC_GENESIS_SHA256:-}
      CPC_GENESIS_FILE: ${CPC_GENESIS_FILE:-}
    command: ["python", "-m", "uvicorn", "comet:application", "--factory", "--host", "127.0.0.1", "--port", "${EXPLORER_API_PORT}", "--workers", "1", "--limit-concurrency", "32", "--timeout-keep-alive", "5"]
    volumes:
      - ${WEB_INDEX:?Run web_services.py}:/data
      - ${WEB_GENESIS:?Run web_services.py}:/config/genesis.json:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${EXPLORER_API_PORT}/api/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 18
  frontend:
    build: ./frontend
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: ${EXPLORER_FRONTEND_PORT}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${EXPLORER_FRONTEND_PORT}/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 18
  gateway:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    network_mode: host
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ${WEB_CONFIG:?Run web_services.py}:/etc/nginx/nginx.conf:ro
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://${WEB_HOST}:${WEB_PORT}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
